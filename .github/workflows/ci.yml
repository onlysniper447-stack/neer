name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Version must match "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      # Latest Node 22. The app runs on 22.12+, but the test toolchain needs
      # newer: jsdom 30 requires ^22.22.2 and its undici 8 fails to load on
      # 22.12 ("Failed to start forks worker"; first CI run, 10 Nov 2026).
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright e2e (mock 1Click and RHEA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @neer/web exec playwright install --with-deps chromium
      # Same projects as `pnpm e2e`. The app runs against local mocks
      # (e2e/mock-1click.ts, e2e/mock-rhea.ts) with a fake RHEA key.
      - run: pnpm --filter @neer/web exec playwright test --project=e2e --project=mobile
# No secrets are used. RHEA and 1Click tests run against local mocks.
