name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Version must match "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      # Latest Node 22. The app runs on 22.12+, but the test toolchain needs
      # newer: jsdom 30 requires ^22.22.2 and its undici 8 fails to load on
      # 22.12 ("Failed to start forks worker"; first CI run, 10 Nov 2026).
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
# Playwright e2e is not run in CI yet: e2e/pages.spec.ts:156 expects a
# "Refund helper" item that the current /tools page does not have, so the
# suite fails on every branch. Run `pnpm e2e` locally until that is fixed.
# No secrets are used. RHEA and 1Click tests run against local mocks.
